<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>いいづか のりものナビ — 飯塚市コミュニティバス案内</title>
<meta name="description" content="飯塚市のコミュニティバス・乗合タクシーで病院や市役所へ行くための、高齢者にやさしい乗り物案内">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1a5c2e">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:title" content="いいづか のりものナビ">
<meta property="og:description" content="飯塚市のコミュニティバス・エリアワゴンで病院や市役所へ。高齢者にやさしい乗り物案内。">
<meta property="og:type" content="website">
<meta property="og:image" content="icon-512.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1 id="app-title">🚌 いいづか のりものナビ</h1>
  <div class="header-btns">
    <button id="font-toggle" class="chip" aria-label="文字の大きさを変える">文字を大きく</button>
    <a class="chip" href="analysis.html">なぜこのアプリ?</a>
  </div>
</header>

<main id="main">

  <!-- STEP 1: 行き先 -->
  <section id="screen-dest" class="screen">
    <h2 class="step-label">① どこへ行きますか?</h2>
    <div class="cat-grid">
      <button class="cat-btn cat-wide" data-cat="hospital">🏥<br>病院・医院</button>
      <button class="cat-btn" data-cat="city">🏛️<br>市役所・支所</button>
      <button class="cat-btn" data-cat="community">🏢<br>交流センター<br>・図書館など</button>
    </div>
    <a id="about-banner" class="about-banner" href="analysis.html">
      <span class="ab-icon">🗺️</span>
      <span class="ab-text">
        <b>なぜこのアプリを作ったのか</b>
        <small>2022年の路線見直しで、バス停が116→76に。データで見る飯塚の交通課題 →</small>
      </span>
    </a>
    <div id="fac-picker" class="hidden">
      <input id="fac-filter" type="search" placeholder="名前で探す(例:いいづか)">
      <ul id="fac-list" class="big-list"></ul>
    </div>
  </section>

  <!-- STEP 2: 乗る場所 -->
  <section id="screen-origin" class="screen hidden">
    <button class="back-btn" data-back="dest">← 戻る</button>
    <h2 class="step-label">② どこから乗りますか?</h2>
    <p class="selected-note">行き先: <b id="dest-name"></b></p>
    <button id="geo-btn" class="wide-btn">📍 今いる場所からバス停を探す</button>
    <div id="geo-result"></div>
    <details id="stop-lists" open>
      <summary>バス停を選ぶ</summary>
      <div id="stop-groups"></div>
    </details>
  </section>

  <!-- STEP 3: 結果 -->
  <section id="screen-result" class="screen hidden">
    <button class="back-btn" data-back="origin">← 戻る</button>
    <h2 class="step-label">③ バスの時間</h2>
    <p class="selected-note">
      <b id="res-origin"></b> から <b id="res-dest"></b> へ
    </p>
    <div class="day-toggle">
      <button id="day-today" class="day-btn active">きょう</button>
      <button id="day-tomorrow" class="day-btn">あした</button>
    </div>
    <div id="results"></div>
    <div id="wagon-card"></div>
  </section>

</main>

<footer>
  <p>データ: 飯塚市オープンデータ(GTFS-JP / BODIK)・令和2年国勢調査。
     時刻・運賃は変更される場合があります。最新情報は
     <a href="https://www.city.iizuka.lg.jp/shokotaisaku/machi/kotsu/bus/" target="_blank" rel="noopener">飯塚市の案内ページ</a>でご確認ください。</p>
</footer>

<script src="data.js"></script>
<script src="app.js"></script>
<script>if("serviceWorker" in navigator){addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}</script>
</body>
</html>
